<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AXIDIA">
  <title>AXIDIA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <button id="pause-btn" class="icon-btn" aria-label="一時停止" hidden>
    <span></span><span></span>
  </button>

  <section id="title" class="screen">
    <div class="stack">
      <h1 class="logo">AXIDIA</h1>
      <p class="sub">free lane rhythm</p>

      <div class="group">
        <div class="label">DIFFICULTY</div>
        <div class="segmented" id="difficulty"></div>
        <div class="best" id="best"></div>
      </div>

      <div class="group">
        <div class="label">SPEED</div>
        <div class="stepper">
          <button data-speed="-1" aria-label="遅く">−</button>
          <output id="speed">3.0</output>
          <button data-speed="1" aria-label="速く">+</button>
        </div>
      </div>

      <div class="group">
        <div class="label">TAP SOUND</div>
        <button id="sfx" class="toggle">ON</button>
      </div>

      <button id="start" class="primary">START</button>
      <p class="hint">落ちてくるノーツが線に重なる瞬間、その位置をタップ</p>
    </div>
    <div class="version">build __VERSION__</div>
  </section>

  <section id="pause" class="screen dim" hidden>
    <div class="stack">
      <div class="label">PAUSED</div>
      <button id="resume" class="primary">RESUME</button>
      <button id="retry-p" class="ghost">RETRY</button>
      <button id="quit" class="ghost">TITLE</button>
    </div>
  </section>

  <section id="result" class="screen" hidden>
    <div class="stack">
      <div class="label" id="r-diff"></div>
      <div class="rank" id="r-rank"></div>
      <div class="score" id="r-score"></div>
      <div class="badge" id="r-badge"></div>
      <dl class="stats">
        <dt class="c-perfect">PERFECT</dt><dd id="r-perfect"></dd>
        <dt class="c-great">GREAT</dt><dd id="r-great"></dd>
        <dt class="c-good">GOOD</dt><dd id="r-good"></dd>
        <dt class="c-miss">MISS</dt><dd id="r-miss"></dd>
        <dt>MAX COMBO</dt><dd id="r-combo"></dd>
        <dt>FAST / SLOW</dt><dd id="r-fastslow"></dd>
      </dl>
      <button id="retry" class="primary">RETRY</button>
      <button id="back" class="ghost">TITLE</button>
    </div>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
